databaseChangeLog:
  - changeSet:
      id: 001-create-property
      author: pisethjavaschool
      changes:
        - createTable:
            tableName: property
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: business_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: phone_number
                  type: VARCHAR(30)

              - column:
                  name: email
                  type: VARCHAR(150)

              - column:
                  name: telegram
                  type: VARCHAR(100)

              - column:
                  name: facebook_page
                  type: VARCHAR(255)

              - column:
                  name: province_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: district_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: commune_code
                  type: VARCHAR(20)

              - column:
                  name: village_code
                  type: VARCHAR(20)

              - column:
                  name: street_address
                  type: VARCHAR(255)

              - column:
                  name: latitude
                  type: DECIMAL(10,7)

              - column:
                  name: longitude
                  type: DECIMAL(10,7)

              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: rejection_reason
                  type: VARCHAR(1000)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: updated_by
                  type: UUID

        - createIndex:
            tableName: property
            indexName: idx_property_owner_id
            columns:
              - column:
                  name: owner_id

        - createIndex:
            tableName: property
            indexName: idx_property_status_active
            columns:
              - column:
                  name: status
              - column:
                  name: active

        - createIndex:
            tableName: property
            indexName: idx_property_location
            columns:
              - column:
                  name: province_code
              - column:
                  name: district_code